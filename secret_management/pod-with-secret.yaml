apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-app-secure
  namespace: production
  labels:
    app: enterprise-app-secure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-app-secure
  template:
    metadata:
      labels:
        app: enterprise-app-secure
    spec:
      serviceAccountName: enterprise-app-sa
      containers:
        - name: app
          image: enterprise-registry.internal/apps/enterprise-service:2.0.0
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: enterprise-app-prod-secrets
                  key: DB_PASSWORD
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: enterprise-app-prod-secrets
                  key: PAYMENT_GATEWAY_API_KEY
          ports:
            - containerPort: 8080
