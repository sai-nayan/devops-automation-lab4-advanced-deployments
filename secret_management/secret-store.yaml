apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend-store
  namespace: production
  labels:
    app.kubernetes.io/managed-by: external-secrets
spec:
  provider:
    vault:
      server: "http://vault.vault-system.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "enterprise-app-role"
          serviceAccountRef:
            name: enterprise-app-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: enterprise-app-vault-sync
  namespace: production
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend-store
    kind: SecretStore
  target:
    name: enterprise-app-prod-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: production/app-config
        property: DB_PASSWORD
    - secretKey: PAYMENT_GATEWAY_API_KEY
      remoteRef:
        key: production/app-config
        property: PAYMENT_GATEWAY_API_KEY
    - secretKey: JWT_SIGNING_SECRET
      remoteRef:
        key: production/app-config
        property: JWT_SIGNING_SECRET
