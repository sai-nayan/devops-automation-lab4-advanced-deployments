# ArgoCD Declarative Application CRD Manifest
# Organization: Enterprise DevOps Delivery
# Student: Sai Nayan Mamilla (sainayanmamilla)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enterprise-gitops-workload
  namespace: argocd
  labels:
    app.kubernetes.io/name: enterprise-workload
    app.kubernetes.io/part-of: enterprise-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/sai-nayan/devops-automation-lab4-advanced-deployments.git'
    targetRevision: HEAD
    path: gitops/overlays/production
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
