apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-workload
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: enterprise-workload
  template:
    metadata:
      labels:
        app: enterprise-workload
    spec:
      containers:
        - name: app
          image: enterprise-registry.internal/apps/workload:1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-workload-svc
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app: enterprise-workload
  ports:
    - port: 80
      targetPort: 8080
